name: Linting (Internal)

on:
    workflow_call:
        secrets:
            GH_TOKEN:
                required: true

permissions:
    contents: read

jobs:
    circuit-breaker:
        runs-on: ubuntu-latest
        outputs:
            is_lint_fix: ${{ steps.detect.outputs.is_lint_fix }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 1

            - id: detect
              shell: bash
              run: |
                  msg="$(git log -1 --pretty=%B)"
                  if grep -Fq '[ci-lint-fix]' <<<"$msg"; then
                    echo "is_lint_fix=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "is_lint_fix=false" >> "$GITHUB_OUTPUT"
                  fi

    source:
        needs: circuit-breaker
        if: ${{ needs.circuit-breaker.outputs.is_lint_fix != 'true' }}
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.GH_TOKEN }}
                  persist-credentials: true
                  fetch-depth: 1

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v6.0.10
              with:
                  version: latest
                  run_install: false

            - name: Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

            - name: Cache pnpm modules
              uses: actions/cache@v6.1.0
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1.9.1
              with:
                  version: stable

            - name: Install dependencies
              run: pnpm install

            - name: Sort
              run: pnpm run sort

            - name: Lint
              run: pnpm run lint

            - name: Prettier
              run: pnpm run prettier

            - name: Forge Format
              working-directory: contracts
              run: |
                  forge fmt

            - uses: stefanzweifel/git-auto-commit-action@v7.2.0
              with:
                  commit_message: "style: resolve style guide violations [ci-lint-fix]"
