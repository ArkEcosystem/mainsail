syntax = "proto3";

import "shared.proto";

package getMessages;

message GetMessagesQuery {
    uint32 blockNumber = 1;
    uint32 round = 2;
    bytes validatorsSignedPrevote = 3;
    bytes validatorsSignedPrecommit = 4;
}

message GetMessagesRequest {
    shared.Headers headers = 1;
    GetMessagesQuery query = 2;
}

message GetMessagesResponse {
	shared.Headers headers = 1;
    repeated bytes prevotes = 2;
    repeated bytes precommits = 3;
}
